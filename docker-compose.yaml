services:
  portfolio-web:
    image: ghcr.io/bpcosta1/personal-website:latest
    container_name: personal_website
    restart: unless-stopped
    networks:
      - proxy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.personalwebsite.rule=Host(`bpcosta.com`) || Host(`www.bpcosta.com`)"
      - "traefik.http.routers.personalwebsite.entrypoints=websecure"
      - "traefik.http.routers.personalwebsite.tls.certresolver=myresolver"
      - "traefik.http.services.personalwebsite.loadbalancer.server.port=80"

networks:
  proxy-network:
    external: true
